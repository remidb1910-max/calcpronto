name: Deploy CalcPronto
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      # The artifact list is sometimes empty for a few seconds after the upload ("No artifacts named github-pages"):
      # wait a little, and try a second time if the first deployment fails.
      - run: sleep 15
      - id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - if: steps.deployment.outcome == 'failure'
        run: sleep 45
      - if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
  indexnow:
    # Tells Bing, Yandex, Seznam and Naver about the pages added by this push. Never blocks the deployment.
    needs: deploy
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - run: python3 .github/indexnow.py
